<title>Five-Minute Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column — questions as stacked "cards on a game table", result sheet pinned at the end */
:root{
  --bg:#e9ede6; --surface:#f8faf6; --ink:#1d2a22; --muted:#55665b; --line:#c9d3c8;
  --accent:#8a6a1f; --accent-ink:#fffaf0; --pick:#1f4a36; --pick-ink:#f2f7f1;
  --display:"Young Serif",Georgia,serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a14; --surface:#16251c; --ink:#e4ece3; --muted:#9db0a2; --line:#2c4034;
  --accent:#d6b25e; --accent-ink:#1a1407; --pick:#3e7a5b; --pick-ink:#f2f7f1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a14; --surface:#16251c; --ink:#e4ece3; --muted:#9db0a2; --line:#2c4034;
  --accent:#d6b25e; --accent-ink:#1a1407; --pick:#3e7a5b; --pick-ink:#f2f7f1; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:32px 64px;display:grid;gap:20px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,6vw,2.75rem);line-height:1.1;margin:0;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:60ch}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0}
fieldset{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:18px;margin:0;display:grid;gap:12px;min-width:0}
legend{float:left;width:100%;padding:0;font-family:var(--display);font-size:1.2rem;line-height:1.3}
legend span{display:block;font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.08em;margin-bottom:4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:8px}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt label{display:block;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--bg);height:100%;box-sizing:border-box}
.opt label b{display:block}
.opt label small{color:var(--muted);font-size:.85rem}
.opt input:checked+label{background:var(--pick);color:var(--pick-ink);border-color:var(--pick)}
.opt input:checked+label small{color:var(--pick-ink);opacity:.85}
.opt input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.names label{display:grid;gap:4px;font-weight:700;font-size:.9rem}
input[type=text]{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=text]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sheet{border:2px solid var(--accent);border-radius:12px;background:var(--surface);padding:20px;display:grid;gap:14px;min-width:0}
.sheet h2{font-family:var(--display);font-weight:400;font-size:1.8rem;line-height:1.15;margin:0;text-wrap:balance}
.sheet .sub{margin:0;color:var(--muted)}
.empty{color:var(--muted);margin:0}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.stat{border:1px solid var(--line);border-radius:8px;text-align:center;padding:6px 2px;background:var(--bg)}
.stat .k{font-size:.7rem;letter-spacing:.1em;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat .m{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.sheet h3{margin:0;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.sheet ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.hook{margin:0;font-style:italic}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font:inherit;font-weight:700;border-radius:8px;padding:10px 16px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.note{font-size:.85rem;color:var(--muted);margin:0}
textarea{width:100%;box-sizing:border-box;font-family:var(--mono);font-size:.8rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:10px;min-height:120px}
@media (max-width:420px){.stats{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:no-preference){.sheet{transition:border-color .2s}}
</style>

<main class="wrap">
  <header style="display:grid;gap:10px">
    <p class="eyebrow">Game night · Level 5 one-shot</p>
    <h1>Five-Minute Hero</h1>
    <p class="lede">Answer six quick questions and you'll get a ready-to-play character built from the standard D&amp;D rules. Copy the result and paste it into our Discord before the game. The DM handles the fine print.</p>
  </header>

  <form id="quiz" novalidate></form>

  <fieldset>
    <legend><span>LAST STEP</span>Names</legend>
    <div class="names">
      <label for="player">Your name<input type="text" id="player" autocomplete="given-name" placeholder="e.g. Sam"></label>
      <label for="charname">Character name (optional)<input type="text" id="charname" placeholder="Leave blank and we'll suggest one"></label>
    </div>
  </fieldset>

  <section class="sheet" id="sheet" aria-live="polite"></section>
</main>

<script>
const STD=[15,14,13,12,10,8], AB=["STR","DEX","CON","INT","WIS","CHA"];
const CLASSES={
 Barbarian:{pri:["STR","CON","DEX","WIS","CHA","INT"],bg:"Soldier",pitch:"a furious powerhouse who wades into the fight and refuses to fall",turn:["Rage to hit harder and shrug off damage","Swing a big weapon twice each turn","Stand at the front and soak hits for the party"]},
 Bard:{pri:["CHA","DEX","CON","WIS","INT","STR"],bg:"Criminal",pitch:"a silver-tongued performer whose magic lives in words and music",turn:["Hand allies Bardic Inspiration dice for big moments","Cast spells that charm, confuse, or heal","Do the talking when the party meets someone new"]},
 Cleric:{pri:["WIS","CON","STR","CHA","INT","DEX"],bg:"Acolyte",pitch:"a divine champion who keeps the party alive and smites the wicked",turn:["Heal friends and shield them with spells","Channel Divinity for a burst of holy power","Hold the line in armor with a mace when needed"]},
 Druid:{pri:["WIS","CON","DEX","INT","CHA","STR"],bg:"Sage",pitch:"a guardian of the wild who speaks for nature and wears its shapes",turn:["Wild Shape into an animal to scout or fight","Cast nature spells that tangle, heal, or call storms","Read the land and its creatures"]},
 Fighter:{pri:["STR","CON","DEX","WIS","CHA","INT"],bg:"Soldier",pitch:"a disciplined warrior who has trained for exactly this",turn:["Attack twice every turn","Action Surge for one extra burst of actions","Use Second Wind to patch yourself up mid-fight"]},
 Monk:{pri:["DEX","WIS","CON","STR","INT","CHA"],bg:"Acolyte",pitch:"a lightning-fast martial artist who turns their body into a weapon",turn:["Throw a flurry of strikes using Focus","Stun enemies with a precise blow","Move fast and deflect attacks"]},
 Paladin:{pri:["STR","CHA","CON","WIS","DEX","INT"],bg:"Acolyte",pitch:"a sworn knight whose oath gives their blade holy fire",turn:["Pour divine power into a hit with Divine Smite","Heal with Lay on Hands","Stand between your friends and danger in heavy armor"]},
 Ranger:{pri:["DEX","WIS","CON","STR","INT","CHA"],bg:"Soldier",pitch:"a sharp-eyed hunter and tracker who never loses the trail",turn:["Mark a target with Hunter's Mark for extra damage","Fire your bow twice each turn","Scout ahead, track, and spot trouble first"]},
 Rogue:{pri:["DEX","CON","INT","WIS","CHA","STR"],bg:"Criminal",pitch:"a quick, sneaky specialist who strikes where it hurts",turn:["Land one big Sneak Attack hit per turn","Hide, dash, or slip away as a bonus action","Pick locks, find traps, and get into places"]},
 Sorcerer:{pri:["CHA","CON","DEX","WIS","INT","STR"],bg:"Sage",pitch:"someone born with raw magic in their blood that barely stays contained",turn:["Throw big spells like Fireball","Twist your spells with Metamagic","Spend Sorcery Points to cast more"]},
 Warlock:{pri:["CHA","CON","DEX","WIS","INT","STR"],bg:"Criminal",pitch:"someone who made a deal with a mysterious patron and got real power for it",turn:["Blast enemies with Eldritch Blast every turn","Use Invocations, small permanent magic tricks","Recover your few spell slots after a short rest"]},
 Wizard:{pri:["INT","CON","DEX","WIS","CHA","STR"],bg:"Sage",pitch:"a scholar of magic with a spellbook for every problem",turn:["Pick from the biggest spell list in the game","Cast Fireball, shields, and clever utility spells","Recover spells on a short rest with Arcane Recovery"]}
};
const Q=[
 {id:"q1",label:"When the fight starts, you…",opts:[
  ["Charge in first","Get up close and take the hits",{Barbarian:3,Fighter:3,Paladin:2,Monk:1}],
  ["Strike from the shadows","Find the angle, hit hard, vanish",{Rogue:3,Ranger:2,Monk:2}],
  ["Bend reality","Throw magic from the back line",{Wizard:3,Sorcerer:3,Warlock:3}],
  ["Keep everyone standing","Heal, protect, and support",{Cleric:3,Druid:2,Bard:2,Paladin:1}]]},
 {id:"q2",label:"Where does your power come from?",opts:[
  ["Training and grit","Years of practice",{Fighter:2,Monk:2,Rogue:2,Ranger:1}],
  ["Faith or a sacred oath","A god or a promise you keep",{Cleric:3,Paladin:3}],
  ["Books and study","You figured magic out",{Wizard:4}],
  ["Born with it","It's in your blood",{Sorcerer:4}],
  ["A deal you made","Someone powerful owes you",{Warlock:4}],
  ["Nature itself","Forests, beasts, storms",{Druid:3,Ranger:2}],
  ["Pure fury","Emotion turned into strength",{Barbarian:4}],
  ["Charm and art","Music, stories, and nerve",{Bard:4}]]},
 {id:"q3",label:"How much do you want to keep track of?",opts:[
  ["Keep it simple","A few big moves, mostly hitting things",{Barbarian:2,Fighter:2,Rogue:1}],
  ["Some choices","A handful of tricks each fight",{Paladin:1,Ranger:1,Monk:1,Warlock:1,Rogue:1}],
  ["Give me all the options","Lots of spells and decisions",{Wizard:2,Cleric:1,Druid:2,Bard:1,Sorcerer:1}]]},
 {id:"q4",label:"A free afternoon in town. You're…",opts:[
  ["Talking people into things","Deals, rumors, free drinks",{Bard:2,Warlock:1,Sorcerer:1,Paladin:1}],
  ["In the library or temple","Reading, praying, researching",{Wizard:2,Cleric:2}],
  ["Out past the city walls","Woods and wild places",{Ranger:2,Druid:2}],
  ["In the tavern brawl","Arm-wrestling, sparring",{Barbarian:2,Fighter:2,Monk:1}],
  ["Somewhere you shouldn't be","Locked doors are a suggestion",{Rogue:3,Warlock:1}]]},
 {id:"q5",label:"Pick a body type for your hero",opts:[
  ["Big and imposing","Towering or tusked",{sp:["Goliath","Orc"]}],
  ["Small and quick","Easy to overlook",{sp:["Halfling","Gnome"]}],
  ["Graceful and ancient","Long-lived and otherworldly",{sp:["Elf","Tiefling"]}],
  ["Sturdy and stubborn","Built like a mountain",{sp:["Dwarf","Dragonborn"]}],
  ["Just a regular person","An everyday human",{sp:["Human"]}]]},
 {id:"q6",label:"How do you want to play them?",opts:[
  ["The noble hero","Does the right thing, loudly",{tone:"noble"}],
  ["The lovable scoundrel","Charming, a little shady",{tone:"scoundrel"}],
  ["The mysterious stranger","Says little, knows more",{tone:"mystery"}],
  ["The comic relief","Here for a good time",{tone:"comic"}]]}
];
const SPECIES_FIT={Goliath:["Barbarian","Fighter","Paladin"],Orc:["Barbarian","Fighter","Ranger"],Halfling:["Rogue","Bard","Ranger","Monk"],Gnome:["Wizard","Rogue","Bard"],Elf:["Wizard","Ranger","Druid","Monk"],Tiefling:["Warlock","Sorcerer","Bard"],Dwarf:["Cleric","Fighter","Paladin"],Dragonborn:["Paladin","Sorcerer","Fighter"]};
const HOOKS={
 noble:"Swore to protect someone who is now in danger, and won't rest until they're safe.",
 scoundrel:"Owes a large debt to the wrong people and is hoping this adventure pays it off.",
 mystery:"Carries a sealed letter they've never opened and won't explain.",
 comic:"Is absolutely certain they're the chosen one of a prophecy nobody else has heard of."};
const NAMES={Goliath:["Kavaki","Thalai"],Orc:["Grusk","Varra"],Halfling:["Pip Tealeaf","Wren Underbough"],Gnome:["Fizzwick","Nissa Brightcog"],Elf:["Aelar","Sylvara"],Tiefling:["Mordai","Vex"],Dwarf:["Brunna Ironfell","Tordek"],Dragonborn:["Arjhan","Sora Kerrhylon"],Human:["Mara Voss","Tobin Hale"]};

const form=document.getElementById("quiz");
form.style.display="grid";form.style.gap="20px";
Q.forEach((q,i)=>{
  const fs=document.createElement("fieldset");
  fs.innerHTML=`<legend><span>QUESTION ${i+1} OF ${Q.length}</span>${q.label}</legend><div class="opts"></div>`;
  const box=fs.querySelector(".opts");
  q.opts.forEach((o,j)=>{
    const id=`${q.id}_${j}`,d=document.createElement("div");d.className="opt";
    d.innerHTML=`<input type="radio" name="${q.id}" id="${id}" value="${j}"><label for="${id}"><b>${o[0]}</b><small>${o[1]}</small></label>`;
    box.appendChild(d);
  });
  form.appendChild(fs);
});

let override=null;
function answers(){const a={};Q.forEach(q=>{const c=form.querySelector(`input[name=${q.id}]:checked`);if(c)a[q.id]=q.opts[+c.value][2];});return a;}
function scoreClasses(a){
  const s={};Object.keys(CLASSES).forEach(k=>s[k]=0);
  ["q1","q2","q3","q4"].forEach(id=>{if(a[id])for(const[k,v]of Object.entries(a[id]))s[k]+=v;});
  return Object.entries(s).sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0]));
}
function pickSpecies(a,cls){
  const opts=a.q5?a.q5.sp:["Human"];
  return opts.find(sp=>(SPECIES_FIT[sp]||[]).includes(cls))||opts[0];
}
function stats(cls){const o={};CLASSES[cls].pri.forEach((ab,i)=>o[ab]=STD[i]);return o;}
const mod=v=>{const m=Math.floor((v-10)/2);return(m>=0?"+":"")+m;};
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(){
  const a=answers(),n=Object.keys(a).length,sheet=document.getElementById("sheet");
  if(n<4){sheet.innerHTML=`<h3>Your character</h3><p class="empty">Answer at least the first four questions and your hero appears here. ${n?`(${n} of ${Q.length} answered)`:""}</p>`;return;}
  const ranked=scoreClasses(a),cls=override||ranked[0][0],runner=ranked.find(r=>r[0]!==cls)[0];
  const sp=pickSpecies(a,cls),c=CLASSES[cls],st=stats(cls),tone=a.q6?a.q6.tone:"noble";
  const player=document.getElementById("player").value.trim();
  const cname=document.getElementById("charname").value.trim()||NAMES[sp][cls.length%2];
  const article=/^[AEIOU]/.test(sp)?"An":"A";
  const statHtml=AB.map(k=>`<div class="stat"><div class="k">${k}</div><div class="v">${st[k]}</div><div class="m">${mod(st[k])}</div></div>`).join("");
  const copy=`PLAYER: ${player||"(your name)"}
CHARACTER: ${cname}, level 5 ${sp} ${cls} (${c.bg} background)
VIBE: ${c.pitch}. Played as ${{noble:"the noble hero",scoundrel:"a lovable scoundrel",mystery:"a mysterious stranger",comic:"the comic relief"}[tone]}.
SCORES (standard array): ${AB.map(k=>`${k} ${st[k]}`).join(", ")}
HOOK: ${HOOKS[tone]}
DM: please finish the sheet (background bonuses, HP, gear, spells) from the SRD.`;
  sheet.innerHTML=`
    <h3>Your character</h3>
    <h2>${esc(cname)}</h2>
    <p class="sub">${article} level 5 ${sp} ${cls} · ${c.bg} background</p>
    <p style="margin:0">You're ${c.pitch}.</p>
    <div class="stats">${statHtml}</div>
    <h3>On your turn</h3>
    <ul>${c.turn.map(t=>`<li>${t}</li>`).join("")}</ul>
    <h3>Story hook</h3>
    <p class="hook">${HOOKS[tone]}</p>
    <div class="row">
      <button type="button" id="copyBtn">Copy for Discord</button>
      <button type="button" class="ghost" id="swapBtn">Try ${runner} instead</button>
      ${override?`<button type="button" class="ghost" id="resetBtn">Back to my best match</button>`:""}
    </div>
    <p class="note" id="copyNote">Paste this in the game channel. The DM fills in hit points, gear, and spells.</p>
    <textarea id="copyText" readonly aria-label="Character summary to copy">${esc(copy)}</textarea>`;
  document.getElementById("copyBtn").onclick=async()=>{
    const ta=document.getElementById("copyText"),note=document.getElementById("copyNote");
    try{await navigator.clipboard.writeText(ta.value);note.textContent="Copied. Paste it into Discord.";}
    catch(e){ta.focus();ta.select();note.textContent="Text selected. Press Ctrl+C (or ⌘C) to copy.";}
  };
  document.getElementById("swapBtn").onclick=()=>{override=runner;render();};
  const r=document.getElementById("resetBtn");if(r)r.onclick=()=>{override=null;render();};
}
form.addEventListener("change",()=>{override=null;render();});
let t;["player","charname"].forEach(id=>document.getElementById(id).addEventListener("input",()=>{clearTimeout(t);t=setTimeout(render,250);}));
render();
</script>
