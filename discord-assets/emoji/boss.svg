<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>boss: dragon head</title>
  <g stroke="#4a3410" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- back horn -->
    <path d="M96,44 C108,36 118,34 126,38 C116,43 109,49 105,58 Z" fill="#a17a2b"/>
    <!-- neck spines -->
    <path d="M110,62 L124,66 L112,76 Z M113,82 L126,90 L115,96 Z" fill="#d6b25e"/>
    <!-- lower jaw -->
    <path d="M64,72 L20,77 C15,78 15,84 20,85 L50,90 C60,92 70,91 74,88 Z" fill="#2c5a41"/>
    <!-- mouth -->
    <path d="M14,66 L64,72 L20,77 Z" fill="#5a1e14"/>
    <!-- head and neck -->
    <path d="M10,56 C14,48 28,46 42,44 L58,35 C68,28 82,26 94,31 C106,37 112,49 112,63 C112,84 116,102 122,124 L76,124 C76,110 74,99 70,90 L64,72 L14,66 C9,64 8,60 10,56 Z" fill="#3e7a5b"/>
    <!-- front horn -->
    <path d="M72,34 C84,16 102,7 124,5 C110,14 98,25 90,39 Z" fill="#d6b25e"/>
  </g>
  <!-- light on snout and brow -->
  <path d="M16,55 C22,51 32,50 44,48 L60,39 C68,34 78,32 86,34" fill="none" stroke="#6aa080" stroke-width="3.5" stroke-linecap="round"/>
  <!-- teeth -->
  <path d="M24,67 L29,67.6 L26.5,73 Z M38,68.6 L43,69.2 L40.5,74.5 Z M30,76 L35,75.4 L32,70.5 Z" fill="#fae2a0"/>
  <!-- eye -->
  <path d="M54,49 Q63,39 75,45 Q66,53 54,49 Z" fill="#fae2a0" stroke="#4a3410" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="66" cy="46.5" rx="1.8" ry="3.6" fill="#1d2a22"/>
  <!-- brow ridge -->
  <path d="M50,44 L60,36 L78,40" fill="none" stroke="#4a3410" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- nostril -->
  <ellipse cx="19" cy="54" rx="3" ry="2" fill="#1d2a22"/>
  <!-- throat plates -->
  <path d="M76,100 L90,98 M74,110 L90,108" stroke="#2c5a41" stroke-width="3" stroke-linecap="round"/>
</svg>
