<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <title>Game Night · Island of Trials</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1510"/>
      <stop offset="0.5" stop-color="#16251c"/>
      <stop offset="0.82" stop-color="#3b4428"/>
      <stop offset="1" stop-color="#8a6a1f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2c21"/>
      <stop offset="1" stop-color="#0a130e"/>
    </linearGradient>
    <radialGradient id="dusk" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d6b25e" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#d6b25e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1510" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#0b1510" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="800" height="232" fill="url(#sky)"/>
  <ellipse cx="610" cy="232" rx="260" ry="90" fill="url(#dusk)"/>
  <g fill="#fae2a0">
    <circle cx="40" cy="30" r="1.4"/>
    <circle cx="120" cy="18" r="1"/>
    <circle cx="210" cy="46" r="1.2"/>
    <circle cx="300" cy="22" r="1.6"/>
    <circle cx="372" cy="60" r="1"/>
    <circle cx="452" cy="30" r="1.3"/>
    <circle cx="520" cy="64" r="1.1"/>
    <circle cx="560" cy="20" r="1.8"/>
    <circle cx="660" cy="44" r="1.2"/>
    <circle cx="700" cy="96" r="1"/>
    <circle cx="760" cy="26" r="1.4"/>
    <circle cx="478" cy="104" r="0.9"/>
    <circle cx="340" cy="98" r="0.9"/>
    <circle cx="610" cy="22" r="1"/>
  </g>
  <polygon points="560,14 561.27,18.73 566,20 561.27,21.27 560,26 558.73,21.27 554,20 558.73,18.73" fill="#fae2a0" opacity="0.9"/>
  <!-- crescent moon -->
  <path d="M724,40 A20,20 0 1 0 744,74 A16,16 0 1 1 724,40 Z" fill="#fae2a0" opacity="0.9"/>
  <!-- distant isle -->
  <path d="M360,232 C380,222 400,216 420,218 C440,214 462,222 486,232 Z" fill="#2a3a26"/>
  <!-- sea -->
  <rect y="230" width="800" height="90" fill="url(#sea)"/>
  <g fill="#d6b25e">
    <rect x="540" y="238" width="140" height="2" rx="1" opacity="0.55"/>
    <rect x="560" y="248" width="96" height="2" rx="1" opacity="0.45"/>
    <rect x="520" y="258" width="70" height="2" rx="1" opacity="0.35"/>
    <rect x="610" y="262" width="80" height="2" rx="1" opacity="0.35"/>
    <rect x="570" y="276" width="56" height="2" rx="1" opacity="0.25"/>
    <rect x="606" y="252" width="14" height="2" rx="1" fill="#fae2a0" opacity="0.8"/>
  </g>
  <!-- island -->
  <path d="M446,234 C462,222 480,216 498,210 L522,190 L548,176 L568,158 L582,152 L646,152 L664,166 L700,182 L736,200 L772,214 L800,222 L800,236 L446,236 Z" fill="#0f1a14"/>
  <path d="M446,234 C462,222 480,216 498,210 L522,190 L548,176 L568,158 L582,152 L592,152" fill="none" stroke="#d6b25e" stroke-width="1.6" stroke-linejoin="round" opacity="0.7"/>
  <!-- ruined tower -->
  <path d="M592,154 L596,84 L602,78 L606,86 L612,70 L619,80 L625,74 L628,90 L632,154 Z" fill="#0f1a14"/>
  <path d="M592,154 L596,84 L602,78 L606,86 L612,70" fill="none" stroke="#d6b25e" stroke-width="1.6" stroke-linejoin="round" opacity="0.75"/>
  <path d="M632,154 L640,140 L646,152 Z M574,156 L582,146 L588,154 Z" fill="#0f1a14"/>
  <path d="M608,108 L608,100 A4,4 0 0 1 616,100 L616,108 Z" fill="#fae2a0"/>
  <circle cx="612" cy="104" r="10" fill="#fae2a0" opacity="0.35" filter="url(#soft)"/>
  <!-- mist -->
  <g filter="url(#blur)" fill="#c9d3c8">
    <ellipse cx="560" cy="226" rx="200" ry="10" opacity="0.18"/>
    <ellipse cx="700" cy="208" rx="120" ry="8" opacity="0.14"/>
    <ellipse cx="420" cy="238" rx="180" ry="8" opacity="0.12"/>
    <ellipse cx="640" cy="170" rx="70" ry="5" opacity="0.10"/>
  </g>
  <rect width="800" height="320" fill="url(#scrim)"/>
  <!-- title, left half -->
  <g font-family="Young Serif">
    <text x="56" y="140" font-size="20" letter-spacing="3" fill="#d6b25e">Game Night ·</text>
    <text x="56" y="188" font-size="38" fill="#fae2a0">Island of Trials</text>
  </g>
  <path d="M56,206 L176,206" stroke="#d6b25e" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>
